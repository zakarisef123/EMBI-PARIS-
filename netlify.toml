# Netlify : génère le site (dist/) à chaque publication. Aucune dépendance à installer.
[build]
  command = "node scripts/build.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# La rénovation énergétique est désormais une partie de la page intérieure.
[[redirects]]
  from = "/renovation/energetique/*"
  to = "/renovation/interieur/#energetique"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
