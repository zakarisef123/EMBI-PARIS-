<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Réalisation | EMBI</title>
  <meta name="robots" content="noindex" />
  <!-- Ancienne adresse des pages chantier (projet.html?p=<id>) : redirection vers realisations/<id>.html -->
  <script>
    (function () {
      var id = new URLSearchParams(location.search).get("p");
      location.replace(id && /^[a-z0-9-]+$/.test(id) ? "realisations/" + id + ".html" : "realisations.html");
    })();
  </script>
  <link rel="canonical" href="https://www.embi.fr/realisations.html" />
</head>
<body>
  <p>Redirection vers <a href="realisations.html">nos réalisations</a>…</p>
</body>
</html>
