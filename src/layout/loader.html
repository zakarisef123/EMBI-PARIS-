<!-- Animation d'intro : visible seulement si la classe « intro » est posée sur <html> (voir le script en tête de page) -->
  <div class="loader" id="loader">
    <svg class="loader__plan" viewBox="0 0 900 420" fill="none" aria-hidden="true" focusable="false">
      <!-- 1. Murs extérieurs (ouvertures : entrée en bas, fenêtres) -->
      <g class="plan-outer">
        <path d="M420 380 H40 V40 H120 M200 40 H360 M440 40 H600 M680 40 H860 V220 M860 290 V380 H480" />
      </g>
      <!-- 2. Cloisons : le mot « embi » est caché dedans (avec les portes) -->
      <g class="plan-walls">
        <path d="M240 320 H200 M150 320 H100 V140 H240 V230 H100" />
        <path d="M320 320 V140 H480 V320 M400 140 V250 M400 300 V320" />
        <path d="M560 40 V320 H650 M600 320 H560 M560 160 H700 V320 H650" />
        <path d="M780 160 V250 M780 300 V320" />
        <path d="M40 140 H100 M240 140 H320 M480 140 H560 M700 160 H860" />
      </g>
      <!-- 3. Portes, fenêtres, mobilier, pièces -->
      <g class="plan-details">
        <path d="M150 320 V370 A50 50 0 0 1 200 320" />
        <path d="M400 300 H450 A50 50 0 0 0 400 250" />
        <path d="M600 320 V370 A50 50 0 0 0 650 320" />
        <path d="M780 300 H830 A50 50 0 0 0 780 250" />
        <path d="M480 380 V330 A50 50 0 0 0 430 380" />
        <path d="M120 35 H200 M120 45 H200 M360 35 H440 M360 45 H440 M600 35 H680 M600 45 H680 M855 220 V290 M865 220 V290" />
        <rect x="336" y="170" width="52" height="70" rx="4" />
        <circle cx="630" cy="245" r="22" />
        <rect x="712" y="178" width="54" height="22" rx="3" />
      </g>
      <g class="plan-labels">
        <text x="170" y="195" text-anchor="middle">SDB</text>
        <text x="440" y="195" text-anchor="middle">CH. 2</text>
        <text x="360" y="275" text-anchor="middle">CH. 1</text>
        <text x="630" y="205" text-anchor="middle">SÉJOUR</text>
        <text x="660" y="105" text-anchor="middle">CUISINE</text>
        <text x="300" y="360" text-anchor="middle">ENTRÉE</text>
      </g>
      <g class="plan-dims">
        <path d="M40 402 H860 M40 395 v14 M860 395 v14" />
      </g>
      <!-- 4. Révélation : les lettres s'allument -->
      <g class="plan-name">
        <path d="M240 320 H100 V140 H240 V230 H100" />
        <path d="M320 320 V140 H480 V320 M400 140 V320" />
        <path d="M560 40 V320 H700 V160 H560" />
        <path d="M780 160 V320" />
      </g>
      <g class="plan-columns">
        <circle cx="780" cy="100" r="15" />
      </g>
    </svg>
    <div class="loader__inner" aria-hidden="true">
      <p class="loader__caption" id="loaderCaption">Un appartement… <span>vous voyez le nom&nbsp;?</span></p>
      <span class="loader__count" id="loaderCount">100</span>
    </div>
    <button type="button" class="loader__skip" id="loaderSkip">Passer <span aria-hidden="true">→</span></button>
  </div>
